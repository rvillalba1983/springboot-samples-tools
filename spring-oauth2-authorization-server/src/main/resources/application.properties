spring.application.name=spring-oauth2-authorization-server
server.port=9000

# Cliente "máquina a máquina" (grant client_credentials).
# El grant "password" del ejemplo original desapareció en OAuth 2.1 y ya no está soportado.
spring.security.oauth2.authorizationserver.client.samples-client.registration.client-id=samples-client
# {noop} = secreto sin cifrar, solo para el ejemplo. En producción: {bcrypt}...
spring.security.oauth2.authorizationserver.client.samples-client.registration.client-secret={noop}samples-secret
spring.security.oauth2.authorizationserver.client.samples-client.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.samples-client.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.samples-client.registration.scopes=samples.read,samples.write
spring.security.oauth2.authorizationserver.client.samples-client.token.access-token-time-to-live=10m
