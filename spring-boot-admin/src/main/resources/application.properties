spring.application.name=spring-boot-admin
server.port=9089

# --- Servidor ---
# Cada cuánto se consulta el estado de las aplicaciones registradas
spring.boot.admin.monitor.status-interval=30s
spring.boot.admin.monitor.status-lifetime=30s

# Notificaciones por correo cuando una aplicación cambia de estado (requiere spring-boot-starter-mail)
spring.boot.admin.notify.mail.enabled=false
# spring.mail.host=smtp.example.com
# spring.boot.admin.notify.mail.to=equipo@example.com
# spring.boot.admin.notify.mail.from=admin@example.com

# --- Cliente: la propia aplicación se registra en el servidor ---
spring.boot.admin.client.url=http://localhost:${server.port}
spring.boot.admin.client.instance.service-base-url=http://localhost:${server.port}

# Actuator: endpoints que Spring Boot Admin muestra en su consola.
# En producción conviene restringirlos y protegerlos con Spring Security.
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.description=Ejemplo de Spring Boot Admin
